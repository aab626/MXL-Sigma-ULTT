[project]
name = "mxl-sigma-ultt"
version = "2.1.0"
description = "Server latency tester for Median XL Sigma"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "icmplib>=3.0",
    "python-dotenv>=1.0",
    "certifi>=2024.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
